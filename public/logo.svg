<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="共享桌面">
  <title>共享桌面</title>
  <defs>
    <!-- 屏幕：深灰渐变 -->
    <linearGradient id="gScreen" x1="356" y1="128" x2="96" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B7C86"/>
      <stop offset="0.45" stop-color="#46474F"/>
      <stop offset="1" stop-color="#22232A"/>
    </linearGradient>
    <!-- 支架：亮银 → 银灰 -->
    <linearGradient id="gStand" x1="300" y1="300" x2="150" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6D7DE"/>
      <stop offset="0.5" stop-color="#A2A3AD"/>
      <stop offset="1" stop-color="#5C5D67"/>
    </linearGradient>
    <!-- 卡片：纸白 -->
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E5EA"/>
    </linearGradient>
    <!-- 外围投影：一层贴地软影 + 一层环境影，让图形在任意背景上都浮得起来 -->
    <filter id="fShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow in="SourceGraphic" result="soft" dx="0" dy="18" stdDeviation="20" flood-color="#101116" flood-opacity="0.25"/>
      <feDropShadow in="SourceGraphic" result="tight" dx="0" dy="5" stdDeviation="6" flood-color="#101116" flood-opacity="0.16"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 透明背景：不放底板，靠投影把图形从背景上托起来 -->
  <g filter="url(#fShadow)">
    <!-- 桌面主体：放大 1.5 倍并整体居中 -->
    <g transform="translate(-83 -101) scale(1.5)">
      <!-- 显示器屏幕 -->
      <g stroke="#2A2B31" stroke-opacity="0.35" stroke-width="4" stroke-linejoin="round">
        <rect x="96" y="128" width="260" height="168" rx="20" fill="url(#gScreen)"/>
      </g>
      <!-- 支架与底座 -->
      <path d="M211 296h30l10 34h-50z" fill="url(#gStand)"/>
      <rect x="176" y="330" width="100" height="18" rx="9" fill="url(#gStand)"/>

      <!-- 屏幕上的两张共享卡片：互相叠放，像桌面上摆开的便签 -->
      <g stroke="#2A2B31" stroke-opacity="0.45" stroke-width="3">
        <g transform="rotate(-5 176 210)">
          <rect x="130" y="170" width="92" height="80" rx="10" fill="url(#gCard)"/>
          <path d="M144 192h60M144 208h48M144 224h56" stroke="#A2A3AD" stroke-width="6" stroke-linecap="round" fill="none"/>
        </g>
        <g transform="rotate(3 264 200)">
          <rect x="216" y="158" width="96" height="84" rx="10" fill="url(#gCard)"/>
          <path d="M232 182h64M232 200h44" stroke="#A2A3AD" stroke-width="6" stroke-linecap="round" fill="none"/>
          <rect x="232" y="214" width="64" height="14" rx="7" fill="#5C5D67" stroke="none"/>
        </g>
      </g>
    </g>
  </g>
</svg>
